<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>微光 · 内容运营台</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shell.css">
</head>
<body>
  <aside class="sidebar">
    <a href="#tasks" class="brand" aria-label="微光内容运营台首页">
      <span class="brand-mark" aria-hidden="true">
        <svg class="brand-icon" data-icon="glow" viewBox="0 0 24 24" fill="none" focusable="false">
          <circle cx="12" cy="12" r="3.25"></circle>
          <path d="M12 2.75v3M12 18.25v3M2.75 12h3M18.25 12h3M5.46 5.46l2.12 2.12M16.42 16.42l2.12 2.12M18.54 5.46l-2.12 2.12M7.58 16.42l-2.12 2.12"></path>
        </svg>
      </span>
      <span>微光<small>内容运营台</small></span>
    </a>
    <nav aria-label="主导航">
      <a href="#tasks" data-nav="tasks"><svg class="sidebar-icon" data-icon="workspace" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"></rect><path d="M12 3.5v17M3.5 11h17"></path></svg>工作台</a>
      <a href="#assets" data-nav="assets"><svg class="sidebar-icon" data-icon="assets" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M3.5 7.5h6l2-2h9A1.5 1.5 0 0 1 22 7v11.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 1.5-2Z"></path><path d="M2.5 10.5h19"></path></svg>运营资产</a>
      <a href="#analytics" data-nav="analytics"><svg class="sidebar-icon" data-icon="analytics" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 19.5V5M4 19.5h16"></path><path d="m7 15 3.25-3.5 3 2 4.75-6"></path><circle cx="18" cy="7.5" r="1"></circle></svg>效果复盘</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="#settings" class="sidebar-settings" data-nav="settings"><svg class="sidebar-icon" data-icon="settings" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 6h8M16 6h4M4 12h3M11 12h9M4 18h10M18 18h2"></path><circle cx="14" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg>运行设置</a>
      <div id="connection" class="connection">正在连接服务…</div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div><span class="local-dot" aria-hidden="true"></span><span>仅在本机运行</span><button id="refresh" class="quiet" type="button">刷新</button></div>
    </header>
    <main id="main" tabindex="-1"><div class="loading">正在读取工作区…</div></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
